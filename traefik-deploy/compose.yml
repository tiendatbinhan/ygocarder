services:
  app:
    build:
      target: production
    environment:
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.{COMPOSE_PROJECT_NAME:?}.entrypoints=web"
      - "traefik.http.routers.{COMPOSE_PROJECT_NAME:?}.rule=Host(`${HOMELAB_HOSTNAME:?}`)"
      - "traefik.http.services.{COMPOSE_PROJECT_NAME:?}.loadbalancer.server.port=${SERVICE_PORT:?}"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
